name: Regenerate sitemap and pubs index

# Runs nightly and on demand. Reads venues from Supabase, writes
# sitemap.xml, regenerates the venue list inside pubs/index.html
# (between PUBS-INDEX markers) and the Oktoberfest "pouring now" list. Commits + pushes if anything changed,
# then pings IndexNow so Bing/Yandex/DuckDuckGo recrawl.
#
# Required repo secrets:
#   PINTPOINT_SUPABASE_URL
#   PINTPOINT_SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC nightly
  workflow_dispatch:        # manual "Run workflow" button

concurrency:
  group: sitemap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate sitemap.xml
        env:
          PINTPOINT_SUPABASE_URL: ${{ secrets.PINTPOINT_SUPABASE_URL }}
          PINTPOINT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PINTPOINT_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-sitemap.mjs

      - name: Regenerate pubs/index.html venue list
        env:
          PINTPOINT_SUPABASE_URL: ${{ secrets.PINTPOINT_SUPABASE_URL }}
          PINTPOINT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PINTPOINT_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-pubs-index.mjs

      - name: Regenerate Oktoberfest "pouring now" list
        env:
          PINTPOINT_SUPABASE_URL: ${{ secrets.PINTPOINT_SUPABASE_URL }}
          PINTPOINT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PINTPOINT_SUPABASE_SERVICE_ROLE_KEY }}
        # Exits non-zero, leaving the page untouched, if the query fails or the
        # list falls below 10 beers. `continue-on-error` so an out-of-season
        # page does not fail the sitemap job it shares a workflow with — the
        # page simply keeps yesterday's list until it is retired.
        continue-on-error: true
        run: node scripts/generate-oktoberfest-now.mjs

      # STAGE EVERY TRACKED FILE THE GENERATORS TOUCH, not a hand-listed four.
      #
      # This step used to name sitemap.xml, pubs/index.html, ai/counts.json and
      # the Oktoberfest page explicitly. Two generators write outside that list
      # and their output was therefore produced in CI and thrown away every
      # night since it was built:
      #
      #   rewriteHeadlineStats()   - venue/beer/country figures across the root
      #                              HTML pages and ai/*.json. Shipped
      #                              2026-10-01 (81d3f1c); `git log --author=
      #                              pintpoint-sitemap-bot --name-only` shows
      #                              it has never once committed one of them.
      #   rewriteFeaturedVenues()  - the home-page venue chips in index.html.
      #
      # `git add -u` stages modifications to ALREADY-TRACKED files only. That is
      # deliberate over `git add -A`: -A would also pick up anything untracked
      # that happened to be in the runner, which is how a private backlog page
      # once reached the public site. -u cannot add a new file.
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --stat
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "pintpoint-sitemap-bot"
          git config user.email "noreply@pintpoint.co.uk"
          git add -u
          git commit -m "nightly regeneration from Supabase: sitemap, pubs index, counts, headline stats, featured venues"
          git push

      - name: Ping IndexNow (streaming, one URL per request)
        if: steps.diff.outputs.changed == 'true'
        run: ./scripts/indexnow.sh --all

      # LAST, and deliberately after the commit. A broken JSON-LD block is a
      # critical Search Console error but it is not a reason to withhold a
      # fresh sitemap, so this never blocks the regeneration — it just turns
      # the run red so the breakage surfaces here rather than in a Search
      # Console email weeks later, which is how the 2026-10-04 one was found.
      - name: Validate structured data
        run: node scripts/check-structured-data.mjs
