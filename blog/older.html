  <!-- No Blog listing JSON-LD here. This page is noindex and refreshes to another,
       and stub() in scripts/generate-blog-pages.mjs copies this file over every
       stale page-N.html, so a listing written here is frozen at the day it was
       written and then reprinted forever. It still carried nine posts and the old
       Augustiner headline on 2026-11-03, months after the archive moved on. The
       listing that is kept current lives on blog/archive.html. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://pintpoint.co.uk/" },
      { "@type": "ListItem", "position": 2, "name": "Blog", "item": "https://pintpoint.co.uk/blog/" },
      { "@type": "ListItem", "position": 3, "name": "Older posts" }
    ]
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0d1117; --teal: #00D4AA; --text: #ffffff; --muted: #8b949e; --card: #161b22; --border: rgba(255,255,255,0.08); }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
    nav { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 20px 40px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .logo { font-size: 1.3rem; font-weight: 900; letter-spacing: -0.5px; }
    .logo span { color: var(--teal); }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    nav a:hover { color: var(--text); }
    .content { max-width: 760px; margin: 0 auto; padding: 60px 24px 80px; }
    h1 { font-size: clamp(1.8rem, 4.5vw, 2.4rem); font-weight: 900; letter-spacing: -1.2px; line-height: 1.15; margin-bottom: 12px; }
    h1 em { color: var(--teal); font-style: normal; }
    .archive-back { font-size: 0.9rem; margin-bottom: 24px; }
    .archive-back a { color: var(--teal); font-weight: 600; text-decoration: none; }
    .archive-back a:hover { text-decoration: underline; }
    .lede { font-size: 1rem; color: var(--muted); line-height: 1.7; margin-bottom: 40px; }
    .post-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
    .post { display: block; padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; text-decoration: none; color: var(--text); transition: border-color 0.15s; }
    .post:hover { border-color: var(--teal); }
    .post-date { font-size: 0.75rem; font-weight: 700; color: var(--teal); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
    .post-date.note { color: #C0A340; }
    .post-date.essay { color: #9DA5FF; }
    .post-date.postcard { color: #FF8C9E; }
    .post-date.guide { color: var(--teal); }
    .post-title { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.3px; line-height: 1.3; margin-bottom: 8px; }
    .post-excerpt { font-size: 0.9rem; color: var(--muted); line-height: 1.65; }
    .post-read { font-size: 0.8rem; color: var(--teal); font-weight: 600; margin-top: 12px; }
    footer { text-align: center; padding: 40px 24px; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--muted); margin-top: 64px; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--teal); }
    footer .links { display: flex; gap: 24px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
    @media (max-width: 600px) { nav { padding: 16px 20px; } .content { padding: 40px 20px 60px; } }
  </style>
